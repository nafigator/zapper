# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

permissions:
  contents: read
  actions: read

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '22 3 * * *'

env:
  GOLANGCI_LINT_VERSION: 'v2.12.2'

jobs:
  detect-modules:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.set-modules.outputs.modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: |
            **/go.sum
            go.sum
      - id: set-modules
        run: echo modules=$(echo $(go list -C conf -m -json; go list -C writer -m -json; go list -m -json) | jq -s '.' | jq -c '[.[].Dir]') >> $GITHUB_OUTPUT

  tidy:
    name: tidy
    needs: detect-modules
    runs-on: ubuntu-latest
    strategy:
      matrix:
        modules: ${{ fromJSON(needs.detect-modules.outputs.modules) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache-dependency-path: 'go.sum'
          go-version: stable
      - name: Run tidy
        working-directory: ${{ matrix.modules }}
        run: go mod tidy --diff

  checks:
    name: checks
    needs: detect-modules
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      matrix:
        modules: ${{ fromJSON(needs.detect-modules.outputs.modules) }}
        go-version: [ oldstable, stable ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache-dependency-path: 'go.sum'
          go-version: ${{ matrix.go-version }}
      - name: Run Download
        working-directory: ${{ matrix.modules }}
        run: go mod download
      - name: Run govulncheck
        working-directory: ${{ matrix.modules }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v0.0.0-20260709172302-19b0bb6a2727 # v1.6.0
          govulncheck -show verbose ./...

  spelling:
    name: Spell Check with Typos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Actions Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Spell Check Repo
        uses: crate-ci/typos@bee27e3a4fd1ea2111cf90ab89cd076c870fce14 # v1.48.0

  golangci:
    name: lint
    needs: detect-modules
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      matrix:
        modules: ${{ fromJSON(needs.detect-modules.outputs.modules) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: 'go.sum'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Require: The version of golangci-lint to use.
          # When `install-mode` is `binary` (default) the value can be v1.2 or v1.2.3 or `latest` to use the latest version.
          # When `install-mode` is `goinstall` the value can be v1.2.3, `latest`, or the hash of a commit.
          version: ${{ env.GOLANGCI_LINT_VERSION }}

          # Optional: working directory, useful for monorepos
          # working-directory: headers
          working-directory: ${{ matrix.modules }}

          # Optional: golangci-lint command line arguments.
          #
          # Note: By default, the `.golangci.yml` file should be at the root of the repository.
          # The location of the configuration file can be changed by using `--config=`
          args: --timeout=20m --config=/home/runner/work/zapper/zapper/.golangci.yml --output.text.path=stdout --output.sarif.path="${{ matrix.modules }}/results.sarif"

          # Optional: show only new issues if it's a pull request. The default value is `false`.
          # only-new-issues: true

          # Optional: if set to true, then all caching functionality will be completely disabled,
          #           takes precedence over all other caching options.
          # skip-cache: true

          # Optional: if set to true, then the action won't cache or restore ~/go/pkg.
          # skip-pkg-cache: true

          # Optional: if set to true, then the action won't cache or restore ~/.cache/go-build.
          # skip-build-cache: true

          # Optional: The mode to install golangci-lint. It can be 'binary' or 'goinstall'.
          # install-mode: "goinstall"
      - name: Upload SARIF file
        if: always()
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.27.3
        with:
          # Path to SARIF file relative to the root of the repository
          sarif_file: "${{ matrix.modules }}/results.sarif"
          # Optional category for the results
          # Used to differentiate multiple results for one commit
          category: golangci-lint

  tests:
    name: tests
    needs: detect-modules
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ oldstable, stable ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: |
            **/go.sum
            go.sum

      - name: Test conf package
        run: go test -C conf -v -gcflags=-l ./... -race -coverprofile=./conf.out -covermode=atomic

      - name: Test writer package
        run: go test -C writer -v -gcflags=-l ./... -race -coverprofile=./writer.out -covermode=atomic

      - name: Test zapper package
        run: go test -v ./... -gcflags=-l -race -coverprofile=./zapper.out -covermode=atomic

      - name: Check conf package coverage
        uses: vladopajic/go-test-coverage@3306bd46e9f0ed238b9d4f7edbbf7b948728469d # v2.11.2
        with:
          profile: ./conf/conf.out
          local-prefix: github.com/nafigator/zapper
          threshold-file: 100
          threshold-package: 100
          threshold-total: 100

      - name: Check writer package coverage
        uses: vladopajic/go-test-coverage@3306bd46e9f0ed238b9d4f7edbbf7b948728469d # v2.11.2
        with:
          profile: ./writer/writer.out
          local-prefix: github.com/nafigator/zapper
          threshold-file: 100
          threshold-package: 100
          threshold-total: 100

      - name: Check zapper package coverage
        uses: vladopajic/go-test-coverage@3306bd46e9f0ed238b9d4f7edbbf7b948728469d # v2.11.2
        with:
          profile: ./zapper.out
          local-prefix: github.com/nafigator/zapper
          threshold-file: 100
          threshold-package: 100
          threshold-total: 100

      - name: Upload headers coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./conf/conf.out, ./writer/writer.out, ./zapper.out
          flags: unittests
          name: codecov-zapper
          verbose: false
